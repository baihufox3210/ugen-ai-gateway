[project]
name = "ugen-ai-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "baihu", email = "baihu3210@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "openai>=3.31.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ugen-ai-gateway = "ugen_ai_gateway:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.17.0",
]
